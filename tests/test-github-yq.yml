name: Test install yq from GitHub
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: github
          skip_cache: "true"
          yq: "4.40.5"
      - name: Assert installed output describes yq 4.40.5
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          node -e '
            const o = JSON.parse(process.env.INSTALLED);
            if (!o.yq) { console.log("FAIL: no yq key"); process.exit(1); }
            const v = String(o.yq.version || "").replace(/^v/, "");
            if (v !== "4.40.5") { console.log("FAIL: bad version " + o.yq.version); process.exit(1); }
            if (!/github\.com/.test(o.yq.url || "")) { console.log("FAIL: url not from github: " + o.yq.url); process.exit(1); }
            if (o.yq.fromCache !== false) { console.log("FAIL: expected fromCache false, got " + o.yq.fromCache); process.exit(1); }
            if (!o.yq.installedPath) { console.log("FAIL: installedPath missing"); process.exit(1); }
            console.log("PASS");
          '
      - name: Assert yq runs
        run: |
          yq --version
          yq --version | grep -q "4.40.5" || { echo "FAIL: yq version mismatch"; exit 1; }
          echo "PASS"
