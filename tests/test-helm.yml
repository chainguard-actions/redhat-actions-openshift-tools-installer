name: Test helm installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLI_INSTALLER_SKIP_CACHE: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: mirror
          helm: latest
          skip_cache: "true"
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: 'installed' output is empty"
            exit 1
          fi
          echo "PASS: installed output is set"
      - name: Assert helm is on PATH
        run: |
          echo "Checking helm is available..."
          if ! command -v helm &>/dev/null; then
            echo "FAIL: helm not found on PATH"
            exit 1
          fi
          echo "helm version: $(helm version --short 2>&1 || true)"
          echo "PASS: helm is available"
      - name: Assert installed JSON contains helm
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed JSON: $INSTALLED"
          if ! echo "$INSTALLED" | grep -q '"helm"'; then
            echo "FAIL: installed output does not mention helm"
            exit 1
          fi
          echo "PASS: installed output contains helm"
