name: Test installing tkn from the mirror
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: mirror
          skip_cache: "true"
          tkn: "latest"
      - name: Assert installed output and binary
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          VERSION="$(echo "$INSTALLED" | jq -r '.tkn.version // empty')"
          echo "tkn version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: tkn missing from installed output"
            exit 1
          fi
          if ! command -v tkn >/dev/null 2>&1; then
            echo "FAIL: tkn not on PATH"
            exit 1
          fi
          echo "PASS"
