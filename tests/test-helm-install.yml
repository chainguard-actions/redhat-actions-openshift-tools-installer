name: Test helm install from mirror
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          helm: "latest"
          source: mirror
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: installed output is empty"
            exit 1
          fi
          echo "PASS: installed output is set"
      - name: Assert helm is on PATH and executable
        run: |
          echo "which helm: $(which helm || echo 'not found')"
          if ! command -v helm &>/dev/null; then
            echo "FAIL: helm not found on PATH"
            exit 1
          fi
          HELM_VERSION=$(helm version --short 2>&1 || true)
          echo "helm version: $HELM_VERSION"
          echo "PASS: helm is installed and executable"
