name: Test kam and kamel install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: mirror
          kam: latest
          kamel: latest
          skip_cache: "true"
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: installed output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert kam is on PATH
        run: |
          if ! command -v kam >/dev/null 2>&1; then
            echo "FAIL: kam not found on PATH"
            exit 1
          fi
          echo "PASS: kam found at $(command -v kam)"
      - name: Assert kamel is on PATH
        run: |
          if ! command -v kamel >/dev/null 2>&1; then
            echo "FAIL: kamel not found on PATH"
            exit 1
          fi
          echo "PASS: kamel found at $(command -v kamel)"
