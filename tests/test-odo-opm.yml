name: Test odo and opm install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: mirror
          odo: latest
          opm: latest
          skip_cache: "true"
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: installed output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert odo is on PATH
        run: |
          if ! command -v odo >/dev/null 2>&1; then
            echo "FAIL: odo not found on PATH"
            exit 1
          fi
          echo "PASS: odo found at $(command -v odo)"
      - name: Assert opm is on PATH
        run: |
          if ! command -v opm >/dev/null 2>&1; then
            echo "FAIL: opm not found on PATH"
            exit 1
          fi
          echo "PASS: opm found at $(command -v opm)"
