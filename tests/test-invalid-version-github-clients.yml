name: Test invalid version ranges for GitHub clients fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          source: github
          skip_cache: "true"
          chart-verifier: "bogus!!version"
          kn: "bogus!!version"
          opm: "bogus!!version"
          preflight: "bogus!!version"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "installed: $INSTALLED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid version ranges"
            exit 1
          fi
          if [ -n "$INSTALLED" ]; then
            echo "FAIL: expected no installed output"
            exit 1
          fi
          echo "PASS"
