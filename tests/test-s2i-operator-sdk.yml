name: Test s2i and operator-sdk installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: mirror
          s2i: "latest"
          operator-sdk: "latest"
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: installed output is empty"
            exit 1
          fi
          echo "PASS: installed output is set"
      - name: Assert s2i is on PATH
        run: |
          if ! command -v s2i >/dev/null 2>&1; then
            echo "FAIL: s2i not found on PATH"
            exit 1
          fi
          echo "PASS: s2i found at $(command -v s2i)"
      - name: Assert operator-sdk is on PATH
        run: |
          if ! command -v operator-sdk >/dev/null 2>&1; then
            echo "FAIL: operator-sdk not found on PATH"
            exit 1
          fi
          echo "PASS: operator-sdk found at $(command -v operator-sdk)"
