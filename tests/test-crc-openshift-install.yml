name: Test crc and openshift-install install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: mirror
          crc: latest
          openshift-install: latest
          skip_cache: "true"
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: installed output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert crc is on PATH
        run: |
          if ! command -v crc >/dev/null 2>&1; then
            echo "FAIL: crc not found on PATH"
            exit 1
          fi
          echo "PASS: crc found at $(command -v crc)"
      - name: Assert openshift-install is on PATH
        run: |
          if ! command -v openshift-install >/dev/null 2>&1; then
            echo "FAIL: openshift-install not found on PATH"
            exit 1
          fi
          echo "PASS: openshift-install found at $(command -v openshift-install)"
