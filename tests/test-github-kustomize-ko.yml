name: Test installing kustomize and ko from GitHub
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: github
          skip_cache: "true"
          kustomize: "latest"
          ko: "latest"
      - name: Assert installed output and binaries
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          for tool in kustomize ko; do
            VERSION="$(echo "$INSTALLED" | jq -r --arg t "$tool" '.[$t].version // empty')"
            echo "$tool version: $VERSION"
            if [ -z "$VERSION" ]; then
              echo "FAIL: $tool missing from installed output"
              exit 1
            fi
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "FAIL: $tool not on PATH"
              exit 1
            fi
          done
          kustomize version
          ko version
          echo "PASS"
