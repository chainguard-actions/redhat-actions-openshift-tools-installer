name: Test yq installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLI_INSTALLER_SKIP_CACHE: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: github
          github_pat: ${{ github.token }}
          yq: latest
          skip_cache: "true"
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: 'installed' output is empty"
            exit 1
          fi
          echo "PASS: installed output is set"
      - name: Assert yq is on PATH
        run: |
          echo "Checking yq is available..."
          if ! command -v yq &>/dev/null; then
            echo "FAIL: yq not found on PATH"
            exit 1
          fi
          echo "yq version: $(yq --version 2>&1 || true)"
          echo "PASS: yq is available"
      - name: Assert installed JSON contains yq
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed JSON: $INSTALLED"
          if ! echo "$INSTALLED" | grep -q '"yq"'; then
            echo "FAIL: installed output does not mention yq"
            exit 1
          fi
          echo "PASS: installed output contains yq"
