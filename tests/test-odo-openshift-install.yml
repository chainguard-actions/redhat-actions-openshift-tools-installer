name: Test odo and openshift-install install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          odo: "latest"
          openshift-install: "latest"
          source: mirror
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: installed output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert odo is on PATH
        run: |
          if ! command -v odo &>/dev/null; then
            echo "FAIL: odo not found on PATH"
            exit 1
          fi
          echo "odo version: $(odo version --client)"
          echo "PASS"
      - name: Assert openshift-install is on PATH
        run: |
          if ! command -v openshift-install &>/dev/null; then
            echo "FAIL: openshift-install not found on PATH"
            exit 1
          fi
          echo "openshift-install version: $(openshift-install version)"
          echo "PASS"
