name: Test kustomize installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          kustomize: "4.1"
          source: github
          skip_cache: "true"
          github_pat: ${{ github.token }}
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: 'installed' output is empty"
            exit 1
          fi
          if ! echo "$INSTALLED" | grep -qi "kustomize"; then
            echo "FAIL: 'installed' output does not mention kustomize"
            exit 1
          fi
          echo "PASS: installed output contains kustomize"
      - name: Assert kustomize is on PATH and executable
        run: |
          if ! command -v kustomize > /dev/null 2>&1; then
            echo "FAIL: kustomize not found on PATH"
            exit 1
          fi
          echo "kustomize version:"
          kustomize version || true
          echo "PASS: kustomize is installed and executable"
