name: Test mirror-only clients are rejected from GitHub
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          source: github
          skip_cache: "true"
          argocd: "latest"
          butane: "latest"
          crc: "latest"
          helm: "latest"
          oc-mirror: "latest"
          openshift-install: "latest"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "installed: $INSTALLED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since these clients are not available from GitHub"
            exit 1
          fi
          if [ -n "$INSTALLED" ]; then
            echo "FAIL: expected no installed output"
            exit 1
          fi
          echo "PASS"
