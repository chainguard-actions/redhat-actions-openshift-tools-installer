name: Test multiple tools install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: mirror
          oc: "latest"
          tkn: "latest"
      - name: Assert installed output is non-empty
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: installed output is empty"
            exit 1
          fi
          echo "PASS: installed output is non-empty"
      - name: Assert oc binary is on PATH
        run: |
          if ! command -v oc &>/dev/null; then
            echo "FAIL: oc not found on PATH"
            exit 1
          fi
          echo "oc version: $(oc version --client 2>&1 || true)"
          echo "PASS: oc is available"
      - name: Assert tkn binary is on PATH
        run: |
          if ! command -v tkn &>/dev/null; then
            echo "FAIL: tkn not found on PATH"
            exit 1
          fi
          echo "tkn version: $(tkn --help 2>&1 | head -5 || true)"
          echo "PASS: tkn is available"
