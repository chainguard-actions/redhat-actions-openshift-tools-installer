name: Test multiple tools install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: mirror
          oc: "latest"
          helm: "latest"
      - name: Assert installed output is set and contains both tools
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: installed output is empty"
            exit 1
          fi
          # The installed output should be a JSON object containing both tools
          if ! echo "$INSTALLED" | grep -qi "oc"; then
            echo "FAIL: installed output does not mention 'oc'"
            exit 1
          fi
          if ! echo "$INSTALLED" | grep -qi "helm"; then
            echo "FAIL: installed output does not mention 'helm'"
            exit 1
          fi
          echo "PASS: installed output contains both tools"
      - name: Assert oc is on PATH
        run: |
          if ! command -v oc &>/dev/null; then
            echo "FAIL: oc not found on PATH"
            exit 1
          fi
          echo "PASS: oc found at $(which oc)"
      - name: Assert helm is on PATH
        run: |
          if ! command -v helm &>/dev/null; then
            echo "FAIL: helm not found on PATH"
            exit 1
          fi
          echo "PASS: helm found at $(which helm)"
