name: Test multiple tools installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          oc: "latest"
          kn: "latest"
          source: mirror
          skip_cache: "true"
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: 'installed' output is empty"
            exit 1
          fi
          echo "PASS: installed output is set"
      - name: Assert oc is on PATH
        run: |
          if ! command -v oc > /dev/null 2>&1; then
            echo "FAIL: oc not found on PATH"
            exit 1
          fi
          echo "PASS: oc is installed"
      - name: Assert kn is on PATH
        run: |
          if ! command -v kn > /dev/null 2>&1; then
            echo "FAIL: kn not found on PATH"
            exit 1
          fi
          echo "PASS: kn is installed"
