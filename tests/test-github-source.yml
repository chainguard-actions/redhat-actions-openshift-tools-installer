name: Test install from GitHub source
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          yq: "latest"
          source: github
          github_pat: ${{ github.token }}
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: installed output is empty"
            exit 1
          fi
          echo "PASS: installed output is set"
      - name: Assert yq is on PATH
        run: |
          echo "which yq: $(which yq || echo 'not found')"
          if ! command -v yq &>/dev/null; then
            echo "FAIL: yq not found on PATH"
            exit 1
          fi
          YQ_VERSION=$(yq --version 2>&1 || true)
          echo "yq version: $YQ_VERSION"
          echo "PASS: yq is installed from GitHub source"
