name: Test operator-sdk and preflight install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: mirror
          operator-sdk: latest
          preflight: latest
          skip_cache: "true"
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: installed output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert operator-sdk is on PATH
        run: |
          if ! command -v operator-sdk >/dev/null 2>&1; then
            echo "FAIL: operator-sdk not found on PATH"
            exit 1
          fi
          echo "PASS: operator-sdk found at $(command -v operator-sdk)"
      - name: Assert preflight is on PATH
        run: |
          if ! command -v preflight >/dev/null 2>&1; then
            echo "FAIL: preflight not found on PATH"
            exit 1
          fi
          echo "PASS: preflight found at $(command -v preflight)"
