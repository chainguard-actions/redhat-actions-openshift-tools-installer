name: Test heavy installer tools (crc, crda, openshift-install)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: mirror
          skip_cache: "true"
          crc: "latest"
          crda: "latest"
          openshift-install: "latest"
      - name: Assert installed output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: installed output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert crc is on PATH
        run: |
          if ! command -v crc &>/dev/null; then
            echo "FAIL: crc not found on PATH"
            exit 1
          fi
          echo "crc version: $(crc version 2>&1 || true)"
          echo "PASS"
      - name: Assert crda is on PATH
        run: |
          if ! command -v crda &>/dev/null; then
            echo "FAIL: crda not found on PATH"
            exit 1
          fi
          echo "crda version: $(crda version 2>&1 || true)"
          echo "PASS"
      - name: Assert openshift-install is on PATH
        run: |
          if ! command -v openshift-install &>/dev/null; then
            echo "FAIL: openshift-install not found on PATH"
            exit 1
          fi
          echo "openshift-install version: $(openshift-install version 2>&1 || true)"
          echo "PASS"
